name: Bug
description: Algo não funciona como deveria
title: "fix: "
labels: ["tipo: bug"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
      description: Descreva o problema.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: ambiente
    attributes:
      label: Ambiente
      description: Versão do Neuryx ou commit, GPU, versão do driver, modelo usado.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
    validations:
      required: false
